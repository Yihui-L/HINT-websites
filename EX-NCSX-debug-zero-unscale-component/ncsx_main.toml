# NCSX HINT-debug 2.3.0, zero response start and component cubic interpolation.
# Source commit: 0495705cb52feb85e8db2f31f0cc91034197a01b
# Same physical inputs and numerical controls as the preceding VMEC-start run.
[paths]
output_file = "run/hint_debug_ncsx_zero.nc"
vmec_wout = "inputs/wout_ncsx_c09r00_free_nonnegative.nc"
coils = "inputs/ncsx_coils.txt"
vessel = "inputs/NCSX_physical_vessel_half_period.txt"

[grid]
nr = 144
nz = 144
ntor = 144
nfp = 3
r_min = 0.35
r_max = 2.5
z_min = -1.1
z_max = 1.1

[flux]
ntheta = 181
inverse_tolerance_m = 0.0001
max_inverse_iterations = 500

[vacuum]
# Smooth-core model reference current density, A/mm^2; not an engineering fit.
current_density_a_mm2 = 50.0
quadrature_tolerance = 1e-5
# mgrid files remain available for comparisons but are not read by this run.

[wall]
periodic_closure_rtol = 1e-10
minimum_exterior_layers = 3

[profiles]
source = "vmec"
pressure_scale = 1.0

[solver]
mode = "initial"
start_point = "zero"
scale_after = false
# Ramp the pressure target over 20 outer iterations; no amplitude reset after it.
pressure_ramp_iterations = 20
backend = "gpu"
engine = "jax"
magnetic_interpolation = "component"
outer_steps = 200
save_every = 1
axis_seed_r_m = 1.57
axis_seed_z_m = 0.0
axis_residual_tolerance_scale = 100.0

[solver.step_a]
max_step = 0.002
trace_length = 10.0
relative_tolerance = 1e-8
absolute_tolerance = 1e-10

[solver.step_b]
inner_steps = 1000
time_step = 0.001
resistivity = 0.0001
# Zero sentinel: use eta0 outside the first wall as well.
eta1 = 0.0
viscosity = 1e-8
# Direct B1 evolution; zero start freezes B1.n=0 on the rectangular boundary.
kdivb = 1e-4
divergence_projection_iterations = 0
smoothing_every = 1
reference_every = 1000
diagnostics_every = 100
preconditioner_smoothing_passes = 10
preconditioner_b_critical = 1.0
preconditioner_j_low = 4.0
preconditioner_j_high = 8.0

[output]
compression_level = 4
store_stepb_diagnostics = true
