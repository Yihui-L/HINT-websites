<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HINT · 页面已迁移</title></head><body>
<h1>HINT 文档与结果网站</h1>
<p>页面地址已调整，请使用新的入口。</p>
<p><a href="/HINT-websites/Source-Code/">程序与使用手册</a></p>
<p><a href="/HINT-websites/EX-NCSX-debug-vmec-unscale-component/">NCSX 实例档案</a></p>
<script>
"use strict";
const root = "/HINT-websites/";
const routes = [
  ["manual", "Source-Code"],
  ["highbeta_vmec_unscale", "EX-NCSX-debug-vmec-unscale-component"],
];
for (const [oldName, newName] of routes) {
  const prefix = root + oldName;
  if (location.pathname === prefix || location.pathname.startsWith(prefix + "/")) {
    let tail = location.pathname.slice(prefix.length) || "/";
    if (oldName === "manual") tail = tail.replace("/docs-data/examples/", "/docs-data/templates/");
    location.replace(root + newName + tail + location.search + location.hash);
    break;
  }
}
</script></body></html>
