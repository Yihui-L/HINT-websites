# NCSX HINT-debug 2.3.0, direct-B FIELDLINES initialization and component cubic.
# Source commit: 0495705cb52feb85e8db2f31f0cc91034197a01b
# A fresh run; old physical inputs/grid/tolerances are retained.
[paths]
output_file = "run/hint_debug_ncsx_vmec.nc"
vmec_wout = "inputs/wout_ncsx_c09r00_free_nonnegative.nc"
coils = "inputs/ncsx_coils.txt"
vessel = "inputs/NCSX_physical_vessel_half_period.txt"

[grid]
nr = 144
nz = 144
ntor = 144
nfp = 3
r_min = 0.35
r_max = 2.5
z_min = -1.1
z_max = 1.1

[flux]
ntheta = 181
inverse_tolerance_m = 0.0001
max_inverse_iterations = 500

[vacuum]
# Reference centerline current density [A/mm^2] of the smooth-core loop model.
# This is a model assumption, not a validated NCSX engineering current density.
current_density_a_mm2 = 50.0
quadrature_tolerance = 1e-5
# mgrid is retained in inputs/ for comparison; this run does not read it.

[wall]
periodic_closure_rtol = 1e-10
minimum_exterior_layers = 3

[profiles]
source = "vmec"
pressure_scale = 1.0

[solver]
mode = "initial"
start_point = "vmec"
scale_after = false
# VMEC starts at full pressure. No ramp or subsequent amplitude feedback.
backend = "gpu"
engine = "jax"
magnetic_interpolation = "component"
outer_steps = 50
save_every = 1
axis_seed_r_m = 1.57
axis_seed_z_m = 0.0
axis_residual_tolerance_scale = 100.0

[solver.step_a]
max_step = 0.002
trace_length = 10.0
relative_tolerance = 1e-8
absolute_tolerance = 1e-10

[solver.step_b]
inner_steps = 1000
time_step = 0.001
resistivity = 0.0001
# Zero sentinel: use eta0 outside the first wall as well.
eta1 = 0.0
viscosity = 1e-8
# Direct B1 evolution with kdivb, no optional projection.
# The initial response normal field is frozen on the rectangular R-Z boundary.
kdivb = 1e-4
divergence_projection_iterations = 0
smoothing_every = 1
reference_every = 1000
diagnostics_every = 100
preconditioner_smoothing_passes = 10
preconditioner_b_critical = 1.0
preconditioner_j_low = 4.0
preconditioner_j_high = 8.0

[output]
compression_level = 4
store_stepb_diagnostics = true
